[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Vault (~19KB) and the slimmed VaultFactory only fit under the EIP-170 24KB code-size limit with
# the optimizer + via-IR enabled. Required for on-chain deployment (Arbitrum enforces EIP-170).
optimizer = true
optimizer_runs = 200
via_ir = true
# Scripts read broadcast artifacts and write Markdown reports under ./reports.
fs_permissions = [
    { access = "read-write", path = "./reports" },
    { access = "read", path = "./broadcast" },
]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614, url = "https://api-sepolia.arbiscan.io/api" }
